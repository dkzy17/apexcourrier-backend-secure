<title>ApexCourrier — Message Email</title>
<style>
  :root {
    --bg: #f0eeeb;
    --card: #ffffff;
    --ink: #1a1a1a;
    --body: #4a4a4a;
    --muted: #8a8a8a;
    --faint: #b0b0b0;
    --line: #ebe8e4;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --card: #242424;
      --ink: #ebebeb;
      --body: #a0a0a0;
      --muted: #606060;
      --faint: #444444;
      --line: #2e2e2e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161616; --card: #242424; --ink: #ebebeb; --body: #a0a0a0;
    --muted: #606060; --faint: #444444; --line: #2e2e2e;
  }
  :root[data-theme="light"] {
    --bg: #f0eeeb; --card: #ffffff; --ink: #1a1a1a; --body: #4a4a4a;
    --muted: #8a8a8a; --faint: #b0b0b0; --line: #ebe8e4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); }
  u + .body { background-color: #f0eeeb !important; }
  @media (prefers-color-scheme: dark) {
    u + .body { background-color: #161616 !important; }
  }
</style>

<div class="body" style="background-color:var(--bg);padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

<div style="display:none;max-height:0;overflow:hidden;font-size:1px;color:transparent;">
  {{SUBJECT_PREVIEW}}&#847;&#847;&#847;&#847;&#847;&#847;
</div>

<table align="center" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:460px;margin:0 auto;">

  <!-- CARD -->
  <tr><td style="background:var(--card);border-radius:var(--r);overflow:hidden;">

    <!-- BRAND BANNER -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#ff7700;">
      <tr><td style="padding:22px 28px;">
        <img src="{{LOGO_URL}}" alt="" width="28" height="28" style="display:inline-block;vertical-align:middle;border:0;filter:brightness(0) invert(1);">
        <span style="font-family:Georgia,'Times New Roman',serif;font-size:17px;color:#ffffff;vertical-align:middle;padding-left:7px;letter-spacing:-.2px;"><b>Apex</b>Courrier</span>
      </td></tr>
    </table>

    <!-- MESSAGE -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td style="padding:36px 32px 0;">
        <p style="font-size:14px;color:var(--body);line-height:1.65;margin:0;">Dear {{RECEIVER_NAME}},</p>
        <p style="font-size:14px;color:var(--body);line-height:1.65;margin:14px 0 0;">{{MESSAGE}}</p>
      </td></tr>
    </table>

    <!-- CTA -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td style="padding:28px 32px 36px;" align="center">
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{TRACKING_URL}}" style="height:48px;v-text-anchor:middle;width:100%;" arcsize="16%" fillcolor="#ff7700" stroke="f">
        <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;">Track Order</center>
        </v:roundrect>
        <![endif]-->
        <!--[if !mso]><!-->
        <a href="{{TRACKING_URL}}" style="display:block;background:#ff7700;color:#fff;font-size:14px;font-weight:600;text-decoration:none;padding:14px 24px;border-radius:var(--r);text-align:center;letter-spacing:.2px;">Track Order</a>
        <!--<![endif]-->
      </td></tr>
    </table>

    <!-- SIGN OFF -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td style="padding:0 32px;"><div style="border-top:1px solid var(--line);"></div></td></tr>
      <tr><td style="padding:20px 32px 24px;">
        <p style="font-size:13px;color:var(--body);line-height:1.5;margin:0;">Thank you,<br><span style="font-weight:600;color:var(--ink);">The ApexCourrier Team</span></p>
      </td></tr>
    </table>

  </td></tr>

  <!-- FOOTER -->
  <tr><td style="padding:28px 4px 0;text-align:center;">
    <p style="font-size:11px;color:var(--faint);line-height:1.7;margin:0;">
      ApexCourrier &middot; 5 Montague Close, London SE1 9BB
    </p>
    <p style="font-size:11px;color:var(--faint);margin:6px 0 0;">
      <a href="#" style="color:var(--faint);text-decoration:none;">Terms</a>
      <span style="padding:0 6px;">&middot;</span>
      <a href="#" style="color:var(--faint);text-decoration:none;">Privacy</a>
      <span style="padding:0 6px;">&middot;</span>
      <a href="{{UNSUBSCRIBE_URL}}" style="color:var(--faint);text-decoration:underline;">Unsubscribe</a>
    </p>
  </td></tr>

</table>
</div>
