<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="200" height="150" fill="#87ceeb"/>
  
  <!-- Delivery van -->
  <rect x="30" y="80" width="50" height="25" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="25" y="85" width="15" height="15" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  
  <!-- Van wheels -->
  <circle cx="40" cy="110" r="6" fill="#2c3e50"/>
  <circle cx="70" cy="110" r="6" fill="#2c3e50"/>
  
  <!-- Van details -->
  <rect x="35" y="88" width="8" height="6" fill="#ecf0f1"/>
  <rect x="45" y="88" width="8" height="6" fill="#ecf0f1"/>
  
  <!-- Packages in van -->
  <rect x="55" y="88" width="6" height="6" fill="#e67e22"/>
  <rect x="62" y="88" width="6" height="6" fill="#e74c3c"/>
  <rect x="69" y="88" width="6" height="6" fill="#f39c12"/>
  
  <!-- Globe/Earth -->
  <circle cx="130" cy="60" r="25" fill="#27ae60" stroke="#2ecc71" stroke-width="2"/>
  
  <!-- Continents on globe -->
  <path d="M 115 50 Q 125 45 135 50 Q 130 55 125 60 Q 120 55 115 50" fill="#2ecc71"/>
  <path d="M 135 65 Q 145 60 140 70 Q 135 75 130 70 Q 135 65 135 65" fill="#2ecc71"/>
  <path d="M 120 70 Q 130 75 125 80 Q 115 75 120 70" fill="#2ecc71"/>
  
  <!-- Shipping routes/arrows -->
  <path d="M 85 95 Q 100 80 115 70" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 155 70 Q 170 85 160 100" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Worker with safety vest -->
  <circle cx="160" cy="95" r="6" fill="#f4d1ae"/>
  <rect x="156" y="101" width="8" height="12" fill="#f39c12"/>
  <rect x="154" y="113" width="12" height="8" fill="#2c3e50"/>
  
  <!-- Ground -->
  <rect x="0" y="120" width="200" height="30" fill="#95a5a6"/>
  
  <!-- Text overlay -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">International Shipping</text>
</svg>